[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "runlens"
version = "0.1.0"
description = "A cross-platform toolkit for robot time-series anomaly candidates."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = [
    "streamlit>=1.65,<2",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "plotly>=5.24,<7",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
analysis = []  # Kept for compatibility; analysis dependencies are now runtime.
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
runlens = "runlens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".agents", ".claude", ".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
