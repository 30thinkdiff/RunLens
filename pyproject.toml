[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "runlens"
version = "0.0.1"
description = "A cross-platform toolkit for robot time-series analysis (initialization stage)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = ["streamlit>=1.40,<2"]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "plotly>=5.24,<7",
]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
runlens = "runlens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
